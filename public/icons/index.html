<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标库 · HD-Icons</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e6e8ec; --text:#16181d; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .count{font-size:12px;color:var(--muted);background:var(--accent-soft);
    color:var(--accent);padding:2px 8px;border-radius:999px;font-weight:600}
  .src{margin-left:auto;font-size:12px;color:var(--muted)}
  .src a{color:var(--accent);text-decoration:none}
  .controls{display:flex;gap:10px;padding:0 0 14px;flex-wrap:wrap;align-items:center}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);font-size:14px;outline:none;color:var(--text)}
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;transition:.15s}
  .tab:hover{border-color:#cfd4dc;color:var(--text)}
  .tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  main{padding:20px 0 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 8px 8px;cursor:pointer;transition:.15s;text-align:center;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(16,24,40,.08);transform:translateY(-1px)}
  .card .thumb{width:64px;height:64px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(0deg,#f7f8fa,#f7f8fa);border-radius:9px}
  .card img{max-width:60px;max-height:60px;object-fit:contain;display:block}
  .card .nm{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
  .card .tag{position:absolute;top:6px;right:6px;font-size:9px;color:#9aa1ac;
    background:#f2f4f7;border-radius:4px;padding:1px 4px;text-transform:uppercase;letter-spacing:.4px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;
    background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    transition:.22s;pointer-events:none;z-index:50;max-width:88vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 30px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>图标库</h1>
      <span class="count" id="total">…</span>
      <span class="src">来源 <a href="https://github.com/xushier/HD-Icons" target="_blank" rel="noopener">xushier/HD-Icons</a> · MIT</span>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="搜索图标名，例如 docker、nas、kimi…" autocomplete="off">
      <div class="tabs" id="tabs"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>没有匹配的图标</div>
  <footer style="margin-top:24px">点击任意图标即复制它的完整 URL · 索引文件 <a href="icons.json">icons.json</a></footer>
</main>

<div id="toast"></div>

<script>
(function(){
  const grid=document.getElementById('grid'), q=document.getElementById('q');
  const tabsEl=document.getElementById('tabs'), totalEl=document.getElementById('total');
  const emptyEl=document.getElementById('empty'), toast=document.getElementById('toast');
  let data=null, all=[], style='all', kw='', shown=[];

  const io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){ const img=e.target; img.src=img.dataset.src; io.unobserve(img); }
    });
  },{rootMargin:'300px'});

  function toastMsg(t){
    toast.textContent=t; toast.classList.add('show');
    clearTimeout(toastMsg._t);
    toastMsg._t=setTimeout(function(){ toast.classList.remove('show'); },1600);
  }

  function copy(text){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ toastMsg('已复制：'+text); },
        function(){ fallback(text); });
    } else fallback(text);
  }
  function fallback(text){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toastMsg('已复制：'+text); }
    catch(e){ toastMsg('复制失败，请手动选取'); }
    document.body.removeChild(ta);
  }

  function render(){
    const frag=document.createDocumentFragment();
    shown.forEach(function(it){
      const card=document.createElement('div');
      card.className='card';
      card.title=it.name+'  ('+it.style+')';
      const thumb=document.createElement('div'); thumb.className='thumb';
      const img=document.createElement('img');
      img.dataset.src=it.path; img.alt=it.name; img.loading='lazy';
      thumb.appendChild(img);
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=it.name;
      const tag=document.createElement('span'); tag.className='tag';
      tag.textContent = it.style==='svg' ? 'svg' : (it.style==='circle' ? 'cir' : 'png');
      card.appendChild(thumb); card.appendChild(nm); card.appendChild(tag);
      card.addEventListener('click', function(){
        copy(location.origin + it.path);
      });
      frag.appendChild(card); io.observe(img);
    });
    grid.innerHTML=''; grid.appendChild(frag);
    emptyEl.hidden = shown.length>0;
    grid.style.display = shown.length ? '' : 'none';
  }

  function apply(){
    const k=kw.trim().toLowerCase();
    shown = all.filter(function(it){
      if(style!=='all' && it.style!==style) return false;
      if(k && it.name.indexOf(k)===-1) return false;
      return true;
    });
    render();
  }

  fetch('icons.json',{cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(d){
    data=d; all=d.icons; totalEl.textContent = d.total + ' 个';
    const tabs=[{dir:'all',label:'全部',count:d.total}].concat(d.styles.map(function(s){
      return {dir:s.dir,label:s.label,count:s.count};
    }));
    tabsEl.innerHTML='';
    tabs.forEach(function(t){
      const b=document.createElement('button');
      b.className='tab'; b.type='button';
      b.setAttribute('aria-selected', t.dir===style?'true':'false');
      b.textContent = t.label + ' ' + t.count;
      b.addEventListener('click', function(){
        style=t.dir;
        Array.prototype.forEach.call(tabsEl.children,function(c){ c.setAttribute('aria-selected','false'); });
        b.setAttribute('aria-selected','true');
        apply();
      });
      tabsEl.appendChild(b);
    });
    apply();
  }).catch(function(e){
    grid.innerHTML=''; emptyEl.hidden=false;
    emptyEl.textContent='索引加载失败：'+e;
  });

  let timer=null;
  q.addEventListener('input', function(){
    clearTimeout(timer);
    timer=setTimeout(function(){ kw=q.value; apply(); },140);
  });
})();
</script>
</body>
</html>
